naftiko: 1.0.0-alpha2
info:
  label: Veritas NetBackup REST API — Login
  description: 'Veritas NetBackup REST API — Login. 1 operations. Lead operation: Veritas Netbackup Authenticate and Obtain
    a Jwt. Self-contained Naftiko capability covering one Veritas Netbackup business surface.'
  tags:
  - Veritas Netbackup
  - Login
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    VERITAS_NETBACKUP_API_KEY: VERITAS_NETBACKUP_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-login
    baseUri: https://{primaryServer}:1556/netbackup
    description: Veritas NetBackup REST API — Login business capability. Self-contained, no shared references.
    resources:
    - name: login
      path: /login
      operations:
      - name: login
        method: POST
        description: Veritas Netbackup Authenticate and Obtain a Jwt
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.VERITAS_NETBACKUP_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-login-rest
    port: 8080
    description: REST adapter for Veritas NetBackup REST API — Login. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/login
      name: login
      description: REST surface for login.
      operations:
      - method: POST
        name: login
        description: Veritas Netbackup Authenticate and Obtain a Jwt
        call: rest-login.login
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-login-mcp
    port: 9090
    transport: http
    description: MCP adapter for Veritas NetBackup REST API — Login. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: veritas-netbackup-authenticate-and-obtain
      description: Veritas Netbackup Authenticate and Obtain a Jwt
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: rest-login.login
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
