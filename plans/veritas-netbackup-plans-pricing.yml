description: Veritas NetBackup is enterprise backup and data-protection software (now under Cohesity /
  Arctera following the 2024-2025 corporate transactions), sold via direct sales and channel partners.
  The product page returned 403 to public crawlers, and no public pricing is published. There is no self-serve
  developer plan and no published per-tier API quota pricing.
sources:
  - https://www.veritas.com/protection/netbackup
notes: Public product page is gated to web crawlers (403). NetBackup is sold under enterprise license,
  scoped by capacity (front-end TB) and modules (e.g. NetBackup Appliance, NetBackup IT Analytics). Reconciliation
  to a single Contact Sales plan.
plans:
  - id: veritas-netbackup-contact-sales
    name: Contact Sales
    type: enterprise
    description: Custom-quoted NetBackup license. Sizing (front-end TB, sockets, modules) drives price.
    entries:
      - label: Software License
        name: software_license
        type: subscription
        metric: TB
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: NetBackup Software
      - name: NetBackup Appliance
      - name: NetBackup REST API
      - name: NetBackup IT Analytics
